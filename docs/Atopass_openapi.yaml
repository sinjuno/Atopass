openapi: 3.0.3
info:
  title: Atopass API (아토피 피부 기록 서비스)
  version: 1.0.0
  description: |
    아토피 피부 변화를 기록하고, 기록을 분석하며, 진료 참고용 보고서를 만드는 서비스의 API.

    - 점수는 사용자가 느끼는 주관적인 강도(0~10)이며 의료적인 중증도 판정이 아니다.
    - 기록하지 않은 값은 임의로 채우지 않고 `null`로 응답한다.
    - 다른 사용자의 데이터에 접근하면 존재 여부가 드러나지 않도록 `404`를 반환한다.
    - 인증이 필요한 API는 `Authorization: Bearer {accessToken}` 헤더를 사용한다.
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: 회원가입 / 로그인 / 토큰
  - name: Members
    description: 내 정보
  - name: Records
    description: 피부 기록 (하루 1건)
  - name: Photos
    description: 피부 사진
  - name: Analysis
    description: 개인 기록 분석
  - name: Chatbot
    description: 챗봇 대화형 기록
  - name: Reports
    description: 진료 참고용 보고서

paths:
  # ───────────── Auth ─────────────
  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 회원가입 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이미 가입된 이메일 (`EMAIL_DUPLICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: |
        액세스 토큰은 응답 본문으로, 리프레시 토큰은 `HttpOnly; Secure; SameSite=Strict` 쿠키(`refreshToken`)로 전달한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: 리프레시 토큰 쿠키 (14일)
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '401':
          description: 이메일 또는 비밀번호 불일치 (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 토큰 재발급
      description: 쿠키의 리프레시 토큰으로 새 액세스 토큰을 발급한다.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '401':
          description: 리프레시 토큰이 없거나 만료·폐기됨 (`TOKEN_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: 서버에 저장된 리프레시 토큰을 폐기하고 쿠키를 만료시킨다.
      responses:
        '204':
          description: 로그아웃 완료
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────── Members ─────────────
  /members/me:
    get:
      tags: [Members]
      summary: 내 정보 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Members]
      summary: 내 정보 수정
      description: 전달한 필드만 수정한다. 수정 가능한 필드는 협의 후 확정한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────── Records ─────────────
  /records:
    get:
      tags: [Records]
      summary: 피부 기록 목록 조회
      description: 기간에 해당하는 내 기록 목록을 조회한다. 기록이 없는 날짜는 포함되지 않는다.
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: 페이지 번호 (0부터)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RecordPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Records]
      summary: 피부 기록 생성
      description: 하루의 피부 상태와 생활 정보를 하나의 기록으로 저장한다. 같은 날짜의 기록이 이미 있으면 `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRequest'
      responses:
        '201':
          description: 저장 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RecordCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 같은 날짜의 기록이 이미 존재 (`RECORD_ALREADY_EXISTS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      tags: [Records]
      summary: 피부 기록 상세 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RecordDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RecordNotFound'
    put:
      tags: [Records]
      summary: 피부 기록 수정
      description: 수정 가능한 전체 내용을 전달한다. 수정하지 않는 필드도 기존 값을 함께 보낸다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RecordDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RecordNotFound'
    delete:
      tags: [Records]
      summary: 피부 기록 삭제
      description: 기록을 삭제한다. 연결된 사진도 함께 삭제되며, 이미 만든 보고서 PDF에는 영향이 없다.
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RecordNotFound'

  # ───────────── Photos ─────────────
  /records/{recordId}/photos:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    post:
      tags: [Photos]
      summary: 피부 사진 업로드
      description: |
        JPEG/PNG, 파일당 최대 10MB, 기록당 최대 5장. 확장자뿐 아니라 파일 시그니처로 형식을 검증한다.
        사진은 피부 상태를 기록하기 위한 용도이며 AI 진단이나 자동 증상 분석은 하지 않는다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 업로드 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PhotoUploaded'
        '400':
          description: 허용되지 않는 형식(`INVALID_FILE_TYPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RecordNotFound'
        '409':
          description: 기록당 사진 수 초과 (`PHOTO_LIMIT_EXCEEDED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 파일 크기 초과 (`FILE_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /records/{recordId}/photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - $ref: '#/components/parameters/PhotoId'
    get:
      tags: [Photos]
      summary: 피부 사진 조회
      description: 사진은 공개 URL로 노출하지 않으며, 인증된 본인만 이 API로 내려받을 수 있다.
      responses:
        '200':
          description: 이미지 파일
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 사진을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Photos]
      summary: 피부 사진 삭제
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 사진을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────────── Analysis ─────────────
  /analysis/summary:
    get:
      tags: [Analysis]
      summary: 피부 변화 분석 조회
      description: |
        기간 내 기록이 7건 미만이면 `availableForComparison`이 false이다.
        의료적 진단이나 특정 요인이 원인이라는 단정은 하지 않는다.
      parameters:
        - $ref: '#/components/parameters/RequiredStartDate'
        - $ref: '#/components/parameters/RequiredEndDate'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AnalysisSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analysis/trends:
    get:
      tags: [Analysis]
      summary: 피부 변화 그래프 조회
      description: 기록이 없는 날짜는 값을 채우지 않고 점을 만들지 않는다. 각 점은 `recordId`로 기록을 조회할 수 있다.
      parameters:
        - $ref: '#/components/parameters/RequiredStartDate'
        - $ref: '#/components/parameters/RequiredEndDate'
        - name: bodyPart
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BodyPart'
        - name: symptom
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Symptom'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Trends'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analysis/comparison:
    get:
      tags: [Analysis]
      summary: 날짜별 기록 비교
      description: 사용자가 고른 두 날짜(A, B)의 기록을 나란히 비교한다. 기록이 없는 날짜는 `null`.
      parameters:
        - name: dateA
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: dateB
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Comparison'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────── Chatbot ─────────────
  /chatbot/consent:
    get:
      tags: [Chatbot]
      summary: 챗봇 이용 동의 조회
      description: |
        챗봇은 대화와 기록 내용을 외부 AI(Claude)로 보내므로 동의한 회원만 쓸 수 있다.
        프론트는 챗봇 화면에 들어올 때 호출해 `agreed`가 false이면 동의 팝업을 보여준다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatConsent'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Chatbot]
      summary: 챗봇 이용 동의
      description: 이미 동의했다면 처음 동의한 시각을 유지하고 같은 응답을 준다. (여러 번 호출해도 안전하다)
      responses:
        '200':
          description: 동의 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatConsent'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Chatbot]
      summary: 챗봇 이용 동의 철회
      description: |
        철회하면 대화 생성·메시지 전송이 `403 CONSENT_REQUIRED`로 막힌다. 이미 저장한 기록, 쌓인 대화·초안 조회,
        사용자가 확인한 초안의 저장은 계속 할 수 있다. 동의하지 않은 상태에서 호출해도 오류가 아니다.
      responses:
        '204':
          description: 철회 완료
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chatbot/sessions:
    post:
      tags: [Chatbot]
      summary: 챗봇 대화 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  $ref: '#/components/schemas/ChatMode'
      responses:
        '201':
          description: 세션 생성
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ConsentRequired'

  /chatbot/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chatbot]
      summary: 챗봇 메시지 전송
      description: |
        사용자의 문장을 챗봇에 보낸다. 사용자가 이미 제공한 정보는 다시 묻지 않고, 빠진 정보만 질문한다. 응답은 저장된 기록에 근거한다.

        **오류 처리**
        - 입력한 문장을 해석하지 못하거나 점수 범위(0~10)를 벗어나면 오류가 아니라 `200`으로 같은 내용을 다시 묻고 `understood: false`를 내려준다. 3번 연속 실패하면 입력 예시를 안내한다.
        - `message`가 비었거나 500자를 넘으면 `400 INVALID_INPUT`.
        - 이미 기록을 저장해 닫힌 세션이면 `409 SESSION_CLOSED`.
        - 최근 24시간 동안 글로 보낸 메시지가 한도(기본 100회)에 도달하면 `429 CHAT_LIMIT_EXCEEDED`. 선택지 답(`/choices`, `/finish`)은 세지 않는다. LLM을 호출하기 전에 막고, 오래된 메시지가 24시간을 지나면 다시 쓸 수 있다. 프론트는 안내 문구를 보여주고 총정리 화면에서 직접 입력하도록 안내한다.
        - 챗봇 처리(외부 LLM 등) 장애는 `503 CHATBOT_UNAVAILABLE`. 사용자의 입력은 저장하지 않으므로 같은 요청을 다시 보내도 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  maxLength: 500
                  example: 오늘은 팔이 많이 가렵고 잠을 6시간 잤어.
      responses:
        '200':
          description: 챗봇 응답
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatReply'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ConsentRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: 이미 기록을 저장해 닫힌 세션 (`SESSION_CLOSED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 최근 24시간 챗봇 이용 한도 초과 (`CHAT_LIMIT_EXCEEDED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 챗봇 처리 장애 (`CHATBOT_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Chatbot]
      summary: 챗봇 대화 조회
      description: 세션의 대화 내역을 조회한다. 메시지는 30일 뒤 삭제된다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          messages:
                            type: array
                            items:
                              $ref: '#/components/schemas/ChatMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /chatbot/sessions/{sessionId}/choices:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chatbot]
      summary: 챗봇 선택지 답
      description: |
        선택지 버튼으로 고른 답을 보낸다. LLM을 부르지 않고 초안에 바로 반영하며, 다음 질문은 서버의 정해진 문장이다.
        이용 한도(`CHAT_LIMIT_EXCEEDED`)에 세지 않으므로 한도에 도달해도 보낼 수 있다.
        대화 내역에는 고른 값이 "6점", "7.5시간", "예", "홍반, 건조증", "넘어갈게요" 같은 문장으로 남는다.

        - 지금 묻는 항목(`askingField`)에만 답할 수 있다. 다른 항목이면 `400 INVALID_INPUT`.
        - `skip: true`는 "넘어갈게요"(특이사항은 "없어요")다. 고통 지수는 건너뛸 수 없다.
        - 특이사항은 글(`/messages`)로 받으므로 선택지로는 `skip`만 보낼 수 있다.
        - 값이 범위나 형식에 어긋나면 `400 INVALID_INPUT`이고 초안은 바뀌지 않는다.
        - 질의 모드 세션이면 `400 INVALID_INPUT`, 닫힌 세션이면 `409 SESSION_CLOSED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field]
              properties:
                field:
                  type: string
                  enum: [painIndex, sleepHours, medication, skinSigns, notes]
                value:
                  description: |
                    painIndex는 0~10 정수, sleepHours는 0~24 숫자(소수점 한 자리), medication은 boolean,
                    skinSigns는 SkinSign 배열(빈 배열이면 "증상 없음"). skip이 true이면 보내지 않는다.
                  oneOf:
                    - type: integer
                    - type: number
                    - type: boolean
                    - type: array
                      items:
                        type: string
                        enum: [ERYTHEMA, EDEMA, OOZING, EXCORIATION, LICHENIFICATION, XEROSIS, ITCHING]
                skip:
                  type: boolean
                  default: false
            examples:
              painIndex:
                value: { field: painIndex, value: 6 }
              skinSigns:
                value: { field: skinSigns, value: [ERYTHEMA, XEROSIS] }
              skip:
                value: { field: sleepHours, skip: true }
      responses:
        '200':
          description: 챗봇 응답 (메시지 전송과 같은 형식)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatReply'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ConsentRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: 이미 기록을 저장해 닫힌 세션 (`SESSION_CLOSED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chatbot/sessions/{sessionId}/finish:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chatbot]
      summary: 챗봇 기록 마치기
      description: |
        "기록 마치기" 버튼. 필수 항목(고통 지수, 말한 부위의 증상 점수)이 채워졌으면 남은 선택 항목을 묻지 않고
        확인 단계(`requiresConfirmation: true`)로 넘어간다. 채워지지 않았으면 그 항목을 다시 묻는다.
        LLM을 부르지 않으며 이용 한도에 세지 않는다. 대화 내역에는 "기록을 마칠게요"로 남는다.
      responses:
        '200':
          description: 챗봇 응답 (메시지 전송과 같은 형식)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatReply'
        '400':
          description: 질의 모드 세션 (`INVALID_INPUT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ConsentRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: 이미 기록을 저장해 닫힌 세션 (`SESSION_CLOSED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chatbot/sessions/{sessionId}/draft:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Chatbot]
      summary: 챗봇 초안 조회
      description: |
        세션에 쌓인 기록 초안과 진행 상태를 준다. 새로고침·재진입으로 마지막 메시지 응답의 `draft`를 잃었을 때
        일일 총정리 화면이 초안을 다시 채우는 용도다. 값은 마지막 메시지 응답의 `draft`, `pendingFields`,
        `askingField`, `requiresConfirmation`과 같다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatDraftState'
        '400':
          description: 질의 모드 세션에는 기록 초안이 없음 (`INVALID_INPUT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: 이미 기록을 저장해 닫힌 세션 (`SESSION_CLOSED`). 저장된 기록은 `GET /records`로 조회한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chatbot/sessions/{sessionId}/records:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chatbot]
      summary: 챗봇 기록 저장
      description: |
        챗봇이 정리한 기록 초안을 사용자가 확인한 뒤 저장한다.
        `confirmed`가 true가 아니면 저장하지 않는다. 저장 로직은 피부 기록 생성과 공통이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRecordSaveRequest'
      responses:
        '201':
          description: 저장 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RecordCreated'
        '400':
          description: 확인되지 않은 초안(`DRAFT_NOT_CONFIRMED`) 또는 잘못된 데이터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: 같은 날짜의 기록이 이미 존재 (`RECORD_ALREADY_EXISTS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ───────────── Reports ─────────────
  /reports:
    post:
      tags: [Reports]
      summary: 보고서 생성
      description: |
        진료 참고용 보고서를 생성한다. 선택한 기간 내 존재하는 기록만 사용하며 의료진의 판단을 대체하지 않는다.
        PDF는 서버에서 동기로 생성한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Report'
        '400':
          description: 잘못된 기간 또는 기간 내 기록 없음 (`NO_RECORDS_IN_PERIOD`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Reports]
      summary: 보고서 목록 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Reports]
      summary: 보고서 상세 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ReportNotFound'

  /reports/{reportId}/file:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Reports]
      summary: 보고서 파일 다운로드
      description: |
        생성된 PDF를 내려준다. 소유자에게만 허용한다.
        PDF 파일은 30일 뒤 삭제되며, 파일이 없으면 다시 생성해서 내려준다.
      responses:
        '200':
          description: PDF 파일
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ReportNotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 액세스 토큰 (30분)
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: 리프레시 토큰 쿠키 (HttpOnly, Secure, SameSite=Strict, 14일)

  parameters:
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        example: chat-001
    RequiredStartDate:
      name: startDate
      in: query
      required: true
      schema:
        type: string
        format: date
    RequiredEndDate:
      name: endDate
      in: query
      required: true
      schema:
        type: string
        format: date

  responses:
    BadRequest:
      description: 잘못된 요청 데이터 (`INVALID_INPUT`, `INVALID_SCORE_RANGE` 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 인증 필요 또는 인증 실패 (`UNAUTHORIZED`, `TOKEN_EXPIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RecordNotFound:
      description: 기록을 찾을 수 없음 또는 다른 사용자의 기록 (`RECORD_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConsentRequired:
      description: 챗봇 이용에 동의하지 않았거나 철회함 (`CONSENT_REQUIRED`). LLM을 호출하기 전에 막는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SessionNotFound:
      description: 세션을 찾을 수 없음 (`SESSION_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReportNotFound:
      description: 보고서를 찾을 수 없음 (`REPORT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ── 공통 ──
    SuccessBase:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 요청이 성공했습니다.
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: |
                공통: INVALID_INPUT, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR /
                인증·회원: INVALID_CREDENTIALS, TOKEN_EXPIRED, EMAIL_DUPLICATED /
                기록: RECORD_NOT_FOUND, RECORD_ALREADY_EXISTS, INVALID_SCORE_RANGE /
                사진: INVALID_FILE_TYPE, FILE_TOO_LARGE, PHOTO_LIMIT_EXCEEDED /
                챗봇: SESSION_NOT_FOUND, SESSION_CLOSED, CHATBOT_UNAVAILABLE, DRAFT_NOT_CONFIRMED, CONSENT_REQUIRED, CHAT_LIMIT_EXCEEDED /
                보고서: REPORT_NOT_FOUND, NO_RECORDS_IN_PERIOD
              example: RECORD_NOT_FOUND
            message:
              type: string
              example: 해당 기록을 찾을 수 없습니다.
            details:
              type: array
              description: 검증 오류가 난 필드 목록
              items:
                $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: skinConditions[0].symptoms.pain
        reason:
          type: string
          example: 0~10 범위여야 합니다.

    # ── Enum ──
    BodyPart:
      type: string
      description: 마네킹 부위(FACE~BACK, 팔·다리는 좌우·상박·하박, 손·발은 좌우, 등은 뒷면). CHEST~FOOT는 예전 기록을 읽기 위해 남겨 둔 부위
      enum: [FACE, NECK, TRUNK, RIGHT_UPPER_ARM, RIGHT_FOREARM, LEFT_UPPER_ARM, LEFT_FOREARM, GROIN, RIGHT_THIGH, RIGHT_LOWER_LEG, LEFT_THIGH, LEFT_LOWER_LEG, RIGHT_HAND, LEFT_HAND, RIGHT_FOOT, LEFT_FOOT, BACK, CHEST, ABDOMEN, ARM, HAND, LEG, FOOT]
    Symptom:
      type: string
      description: 부위 점수 항목. 지금은 부위의 고통 점수(pain) 하나다. 예전 증상별 점수(itching 등)는 나타난 증상(SkinSign)으로 옮겼다.
      enum: [pain]
    OutdoorActivity:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    ChatMode:
      type: string
      description: RECORD(기록 입력) 또는 QUERY(기록 조회 및 분석)
      enum: [RECORD, QUERY]

    # ── 회원 / 인증 ──
    SignupRequest:
      type: object
      required: [email, password, nickname]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: example-password
        nickname:
          type: string
          example: 사용자
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: example-password
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: 액세스 토큰 유효 시간(초)
          example: 1800
    Member:
      type: object
      properties:
        memberId:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        nickname:
          type: string
          example: 사용자
    MemberUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
        password:
          type: string
          format: password

    # ── 피부 기록 ──
    Symptoms:
      type: object
      description: 부위 점수. 지금은 부위의 고통 점수(pain, 0~10) 하나다.
      required: [pain]
      properties:
        pain:
          type: integer
          minimum: 0
          maximum: 10
      example:
        pain: 4
    SkinCondition:
      type: object
      required: [bodyPart, symptoms]
      properties:
        bodyPart:
          $ref: '#/components/schemas/BodyPart'
        symptoms:
          $ref: '#/components/schemas/Symptoms'
        skinSigns:
          type: array
          description: 이 부위에 나타난 증상. 없으면 생략(응답은 빈 배열). 저장하면 하루의 skinSigns에도 합쳐진다
          items:
            $ref: '#/components/schemas/SkinSign'
    Lifestyle:
      type: object
      properties:
        alcohol:
          type: boolean
          nullable: true
        outdoorActivity:
          allOf:
            - $ref: '#/components/schemas/OutdoorActivity'
          nullable: true
    SkinSign:
      type: string
      description: |
        피부에 나타난 증상(있음/없음). 부위마다, 그리고 하루 단위로 기록한다. 응답은 아래 순서로 정렬된다.
        ERYTHEMA 홍반, EDEMA 부종/구진(결절), OOZING 진물/딱지, EXCORIATION 긁은 자국(찰상), LICHENIFICATION 태선화, XEROSIS 건조증, ITCHING 가려움.
        예전 값은 서버가 뜰 때 옮긴다: PAPULE·NODULE → EDEMA, SCALING은 지움.
      enum: [ERYTHEMA, EDEMA, OOZING, EXCORIATION, LICHENIFICATION, XEROSIS, ITCHING]
      example: ERYTHEMA
    RecordRequest:
      type: object
      description: 부위별 증상(skinConditions)과 고통 지수(painIndex) 중 하나 이상은 있어야 한다.
      required: [recordDate]
      properties:
        recordDate:
          type: string
          format: date
          example: '2026-10-10'
        skinConditions:
          type: array
          description: 부위별 증상 점수. 고통 지수가 있으면 비워도 된다.
          items:
            $ref: '#/components/schemas/SkinCondition'
        painIndex:
          type: integer
          minimum: 0
          maximum: 10
          nullable: true
          description: 고통 지수. 오늘 피부 때문에 느낀 고통의 정도(0은 없음, 10은 매우 심함). 사용자가 느낀 주관적인 정도이며 의료적인 중증도가 아니다. 0도 기록한 값이다.
          example: 6
        sleepHours:
          type: number
          nullable: true
          example: 6
        medication:
          type: boolean
          nullable: true
          description: 오늘 약을 복용했는지. 기록하지 않았으면 null
        skinSigns:
          type: array
          description: 오늘 나타난 증상. 없으면 빈 배열
          items:
            $ref: '#/components/schemas/SkinSign'
        lifestyle:
          $ref: '#/components/schemas/Lifestyle'
        notes:
          type: string
          nullable: true
          example: 저녁에 팔 부위가 가려웠음
    RecordCreated:
      type: object
      properties:
        recordId:
          type: integer
          format: int64
          example: 101
        recordDate:
          type: string
          format: date
          example: '2026-10-10'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-10T21:30:00'
    PhotoRef:
      type: object
      properties:
        photoId:
          type: integer
          format: int64
          example: 501
        uploadedAt:
          type: string
          format: date-time
    RecordDetail:
      allOf:
        - type: object
          properties:
            recordId:
              type: integer
              format: int64
              example: 101
        - $ref: '#/components/schemas/RecordRequest'
        - type: object
          properties:
            sleepScore:
              type: integer
              minimum: 1
              maximum: 5
              nullable: true
              readOnly: true
              description: 수면 점수(서버가 수면 시간으로 계산). 7~8시간이 5점이고 그 범위에서 2시간 벗어날 때마다 1점 감점, 최저 1점. 수면 시간이 없으면 null
              example: 4
            photos:
              type: array
              items:
                $ref: '#/components/schemas/PhotoRef'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    RecordSummary:
      type: object
      description: 목록 항목. 홈·캘린더·그래프는 고통 지수(painIndex)를 하루의 대표 점수로 쓰고, 없으면 부위별 점수의 최고값을 쓴다.
      properties:
        recordId:
          type: integer
          format: int64
        recordDate:
          type: string
          format: date
        skinConditions:
          type: array
          items:
            $ref: '#/components/schemas/SkinCondition'
        painIndex:
          type: integer
          minimum: 0
          maximum: 10
          nullable: true
          description: 고통 지수. 오늘 피부 때문에 느낀 고통의 정도(0은 없음, 10은 매우 심함). 사용자가 느낀 주관적인 정도이며 의료적인 중증도가 아니다. 0도 기록한 값이다.
          example: 6
        sleepHours:
          type: number
          nullable: true
        sleepScore:
          type: integer
          nullable: true
          description: 수면 점수 1~5. 수면 시간이 없으면 null
        photoCount:
          type: integer
    RecordPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RecordSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # ── 사진 ──
    PhotoUploaded:
      type: object
      properties:
        photoId:
          type: integer
          format: int64
          example: 501
        recordId:
          type: integer
          format: int64
          example: 101
        uploadedAt:
          type: string
          format: date-time
          example: '2026-10-10T21:35:00'

    # ── 분석 ──
    AnalysisSummary:
      type: object
      properties:
        period:
          type: object
          properties:
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
        recordCount:
          type: integer
          example: 18
        availableForComparison:
          type: boolean
          description: 기간 내 기록이 7건 이상이면 true
          example: true
        insights:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                description: SYMPTOM_CHANGE(부위·증상 점수 변화) 또는 PAIN_INDEX_CHANGE(고통 지수 변화). 고통 지수 변화이면 bodyPart와 symptom은 null이다.
                enum: [SYMPTOM_CHANGE, PAIN_INDEX_CHANGE]
                example: SYMPTOM_CHANGE
              message:
                type: string
                example: 팔 고통 점수가 평소(평균 3.8)보다 높게 기록된 구간이 있습니다. (3/7~3/8)
              bodyPart:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/BodyPart'
              symptom:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Symptom'
              direction:
                type: string
                description: 평균보다 높게(HIGH) 또는 낮게(LOW) 기록된 구간
                enum: [HIGH, LOW]
              startDate:
                type: string
                format: date
              endDate:
                type: string
                format: date
    Trends:
      type: object
      properties:
        points:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              score:
                type: integer
                minimum: 0
                maximum: 10
              recordId:
                type: integer
                format: int64
    CompareRecord:
      type: object
      nullable: true
      description: 해당 날짜의 기록. 기록이 없으면 null.
      properties:
        date:
          type: string
          format: date
        recordId:
          type: integer
          format: int64
        skinConditions:
          type: array
          items:
            $ref: '#/components/schemas/SkinCondition'
        painIndex:
          type: integer
          minimum: 0
          maximum: 10
          nullable: true
          description: 고통 지수. 오늘 피부 때문에 느낀 고통의 정도(0은 없음, 10은 매우 심함). 사용자가 느낀 주관적인 정도이며 의료적인 중증도가 아니다. 0도 기록한 값이다.
          example: 6
        sleepHours:
          type: number
          nullable: true
        sleepScore:
          type: integer
          nullable: true
          description: 수면 점수 1~5. 수면 시간이 없으면 null
        medication:
          type: boolean
          nullable: true
          description: 오늘 약을 복용했는지. 기록하지 않았으면 null
        skinSigns:
          type: array
          description: 오늘 나타난 증상. 없으면 빈 배열
          items:
            $ref: '#/components/schemas/SkinSign'
        lifestyle:
          $ref: '#/components/schemas/Lifestyle'
        notes:
          type: string
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PhotoRef'
    Comparison:
      type: object
      properties:
        A:
          $ref: '#/components/schemas/CompareRecord'
        B:
          $ref: '#/components/schemas/CompareRecord'

    # ── 챗봇 ──
    ChatSession:
      type: object
      properties:
        sessionId:
          type: string
          example: chat-001
        mode:
          $ref: '#/components/schemas/ChatMode'
    ChatReply:
      type: object
      properties:
        reply:
          type: string
          example: 어젯밤 몇 시간 주무셨나요?
        understood:
          type: boolean
          description: 입력한 문장을 해석했는지. false이면 같은 내용을 다시 물어보는 응답이다.
          example: true
        pendingFields:
          type: array
          description: |
            아직 입력되지 않은 항목. 필수 항목이 먼저 온다. 증상 이름이 아니라 다음 값 중 일부다.
            painIndex(고통 지수, 필수), symptoms(증상 점수. 부위를 말했지만 점수가 아직 없을 때),
            sleepHours(수면), medication(약 복용), skinSigns(나타난 증상), notes(특이사항)
          items:
            type: string
            enum: [painIndex, symptoms, sleepHours, medication, skinSigns, notes]
          example: [sleepHours, medication, skinSigns, notes]
        askingField:
          type: string
          nullable: true
          description: |
            지금 묻는 항목. 서버가 정하며, 화면은 이 값에 맞춰 선택지를 보여 준다.
            painIndex(0~10 버튼), sleepHours(시간 선택), medication(예/아니오), skinSigns(여러 개 선택)는
            `POST /chatbot/sessions/{sessionId}/choices`로 답하고, symptoms(부위·증상 점수)와 notes(특이사항)는 글로 답한다.
            확인 단계이거나 질의 모드면 null.
          enum: [painIndex, symptoms, sleepHours, medication, skinSigns, notes]
          example: sleepHours
        requiresConfirmation:
          type: boolean
          description: true이면 기록 초안을 확인하는 단계(총정리)로 넘어간다.
          example: false
        draft:
          type: object
          nullable: true
          description: 지금까지 대화로 모은 기록 초안. 질의 모드에서는 null. 사용자가 확인한 뒤 기록 저장 API로 보낸다.
          properties:
            skinConditions:
              type: array
              items:
                $ref: '#/components/schemas/SkinCondition'
            painIndex:
              type: integer
              minimum: 0
              maximum: 10
              nullable: true
              description: 고통 지수. 오늘 피부 때문에 느낀 고통의 정도(0은 없음, 10은 매우 심함). 사용자가 느낀 주관적인 정도이며 의료적인 중증도가 아니다. 0도 기록한 값이다.
              example: 6
            sleepHours:
              type: number
              nullable: true
            sleepScore:
              type: integer
              nullable: true
              description: 수면 점수 1~5. 수면 시간이 없으면 null
            medication:
              type: boolean
              nullable: true
            skinSigns:
              type: array
              nullable: true
              description: 나타난 증상. 아직 묻지 않았으면 null, 없다고 답했으면 빈 배열
              items:
                $ref: '#/components/schemas/SkinSign'
            lifestyle:
              $ref: '#/components/schemas/Lifestyle'
            notes:
              type: string
              nullable: true
    ChatConsent:
      type: object
      properties:
        agreed:
          type: boolean
        agreedAt:
          type: string
          format: date-time
          nullable: true
          description: 처음 동의한 시각(초 단위). 동의하지 않았으면 null
    ChatDraftState:
      type: object
      properties:
        draft:
          type: object
          description: 지금까지 모은 기록 초안. 구조는 기록 저장 요청의 record와 같다.
          properties:
            skinConditions:
              type: array
              items:
                $ref: '#/components/schemas/SkinCondition'
            painIndex:
              type: integer
              minimum: 0
              maximum: 10
              nullable: true
              description: 고통 지수. 오늘 피부 때문에 느낀 고통의 정도(0은 없음, 10은 매우 심함). 사용자가 느낀 주관적인 정도이며 의료적인 중증도가 아니다. 0도 기록한 값이다.
              example: 6
            sleepHours:
              type: number
              nullable: true
            sleepScore:
              type: integer
              nullable: true
              description: 수면 점수 1~5. 수면 시간이 없으면 null
            medication:
              type: boolean
              nullable: true
            skinSigns:
              type: array
              nullable: true
              description: 나타난 증상. 아직 묻지 않았으면 null, 없다고 답했으면 빈 배열
              items:
                $ref: '#/components/schemas/SkinSign'
            lifestyle:
              $ref: '#/components/schemas/Lifestyle'
            notes:
              type: string
              nullable: true
        pendingFields:
          type: array
          items:
            type: string
            enum: [painIndex, symptoms, sleepHours, medication, skinSigns, notes]
        askingField:
          type: string
          nullable: true
          description: 마지막 메시지 응답과 같은 값. 확인 단계면 null.
          enum: [painIndex, symptoms, sleepHours, medication, skinSigns, notes]
        requiresConfirmation:
          type: boolean
          description: 마지막 메시지 응답과 같은 값. 새로고침 뒤에도 유지된다.
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [USER, ASSISTANT]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    ChatRecordSaveRequest:
      type: object
      required: [recordDate, confirmed, record]
      properties:
        recordDate:
          type: string
          format: date
          example: '2026-10-10'
        confirmed:
          type: boolean
          description: 사용자가 초안을 확인했을 때만 true
          example: true
        record:
          type: object
          description: 저장할 기록 내용 (피부 기록 생성의 필드와 같다). 부위별 증상(skinConditions)과 고통 지수(painIndex) 중 하나 이상은 있어야 한다.
          properties:
            skinConditions:
              type: array
              items:
                $ref: '#/components/schemas/SkinCondition'
            painIndex:
              type: integer
              minimum: 0
              maximum: 10
              nullable: true
              description: 고통 지수. 오늘 피부 때문에 느낀 고통의 정도(0은 없음, 10은 매우 심함). 사용자가 느낀 주관적인 정도이며 의료적인 중증도가 아니다. 0도 기록한 값이다.
              example: 6
            sleepHours:
              type: number
              nullable: true
            medication:
              type: boolean
              nullable: true
              description: 오늘 약을 복용했는지. 기록하지 않았으면 null
            skinSigns:
              type: array
              description: 오늘 나타난 증상. 없으면 빈 배열
              items:
                $ref: '#/components/schemas/SkinSign'
            lifestyle:
              $ref: '#/components/schemas/Lifestyle'
            notes:
              type: string
              nullable: true
          example:
            painIndex: 6
            sleepHours: 6
            medication: true
            skinSigns: [EXCORIATION, XEROSIS]
            notes: 오늘 팔이 많이 가려웠음

    # ── 보고서 ──
    ReportRequest:
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
          example: '2026-09-10'
        endDate:
          type: string
          format: date
          example: '2026-10-10'
        includePhotos:
          type: boolean
          default: false
    Report:
      type: object
      properties:
        reportId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        includePhotos:
          type: boolean
        createdAt:
          type: string
          format: date-time

security:
  - bearerAuth: []
