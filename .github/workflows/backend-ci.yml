name: backend-ci

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x ./gradlew
      - run: ./gradlew test
