name: Deploy

# main 브랜치에 머지(push)되면 테스트 → 이미지 빌드 → 서버 배포가 자동으로 실행된다.
# Actions 탭에서 "Run workflow"로 수동 실행할 수도 있다. (같은 코드를 다시 배포하거나 복구할 때)
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 동시에 두 번 돌지 않게 한다. 진행 중인 배포는 끝까지 기다린다.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sinjuno/atopass

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 백엔드 테스트
        working-directory: backend
        run: ./gradlew test

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트 빌드
        working-directory: frontend
        run: npm ci && npm run build

  image:
    name: 이미지 빌드
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Oracle 무료 VM은 arm64, 일반 PC·서버는 amd64라서 둘 다 만든다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 서버 배포
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH 준비
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 설정 파일 전송
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/atopass/"

      - name: 배포 (백업 → 새 이미지로 교체)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          APP_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd /opt/atopass
            chmod +x backup.sh
            ./backup.sh || echo '백업을 건너뜁니다(첫 배포이거나 DB가 아직 없음)'
            export APP_TAG=$APP_TAG
            docker compose pull app
            docker compose up -d --remove-orphans
            docker image prune -f
          "

      # 서버가 응답할 때까지 기다리며 확인한다. (JVM이 켜지는 데 시간이 걸린다)
      - name: 배포 확인
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          curl -fsS --retry 30 --retry-delay 6 --retry-all-errors "https://$DOMAIN/" -o /dev/null
          echo "https://$DOMAIN/ 응답 확인"
