spring:
  application:
    name: service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/atopass?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
  web:
    resources:
      # 화면(정적 파일)은 WebConfig에서 직접 서빙한다. (index.html 대체 응답 포함)
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    # 32바이트 이상. 반드시 환경변수로 주입한다 (코드·레포에 넣지 않는다).
    secret: ${JWT_SECRET:}
    access-token-minutes: 30
    refresh-token-days: 14
    cookie-secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  llm:
    # Claude API 키. 환경변수 ANTHROPIC_API_KEY로만 주입한다. 없으면 챗봇은 503(CHATBOT_UNAVAILABLE)을 반환한다.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${LLM_MODEL:claude-opus-5-5}
    effort: ${LLM_EFFORT:low}
    max-tokens: 2048
    timeout-seconds: 30
    # 회원 한 명이 최근 24시간 동안 보낼 수 있는 챗봇 메시지 수. 넘으면 429 CHAT_LIMIT_EXCEEDED
    daily-message-limit: ${CHATBOT_DAILY_LIMIT:100}
  storage:
    # 보고서 PDF/사진 저장 위치. 웹으로 공개되는 경로 밖이어야 한다.
    report-dir: ${REPORT_DIR:./data/reports}
    photo-dir: ${PHOTO_DIR:./data/photos}
