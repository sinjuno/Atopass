spring:
  application:
    name: service
  datasource:
    url: jdbc:h2:mem:atopass;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: test-secret-test-secret-test-secret-1234
    access-token-minutes: 30
    refresh-token-days: 14
    cookie-secure: true
  cors:
    allowed-origins: http://localhost:5173
  storage:
    report-dir: build/test-storage/reports
    photo-dir: build/test-storage/photos
